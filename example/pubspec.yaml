name: flutter_gsm_example
description: "Example app for flutter_gsm - cross-platform GSM/UMTS modem hardware abstraction"
license: NativeMindNONC
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Library dependency
  flutter_gsm:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# See ../pubspec.yaml for why these overrides exist (flutter_dialer/
# flutter_tele/flutter_smsussd version-constraint bugs, not this flow's).
dependency_overrides:
  plugin_platform_interface: ^2.1.8
  flutter_dialer:
    path: ../../flutter_dialer

flutter:
  uses-material-design: true
