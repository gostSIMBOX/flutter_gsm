# FFI binding generator config for libsimbox (libsCpp/asterisk_chan_simbox).
# Regenerate with `dart run ffigen` whenever simbox_api.h/simbox_types.h
# change — never hand-edit lib/src/ffi/simbox_bindings.dart.
# See flows/sdd-flutter_gsm-ffi/02-specifications.md.

name: SimboxBindings
description: >
  Dart FFI bindings for libsimbox's public C API (simbox_api.h),
  generated from the native SDK shipped by sdd-asterisk-chan-simbox.
output: 'lib/src/ffi/simbox_bindings.dart'

headers:
  entry-points:
    - '../../libsCpp/asterisk_chan_simbox/src/simbox_api.h'
  include-directives:
    - '**/simbox_api.h'
    - '**/simbox_types.h'

# simbox_types.h's opaque handles (simbox_handle_t, simbox_device_t, ...)
# are `typedef void *` — ffigen maps these to Pointer<Void> automatically,
# no explicit type-map needed.

# C enum underlying-int-size is technically implementation-defined;
# ffigen flags this as SEVERE by default. Accepted here: libsimbox is
# always compiled locally by the same toolchain (gcc/clang) that builds
# this Dart app's native dependency, for the same target — there is no
# cross-compilation or binary-distribution scenario where the ABI could
# diverge, so mimicking the common gcc/clang enum layout is safe.
silence-enum-warning: true

comments:
  style: any
  length: full

preamble: |
  // Generated by `dart run ffigen` from libsimbox's simbox_api.h/
  // simbox_types.h (libsCpp/asterisk_chan_simbox). Do not hand-edit —
  // see ../../../ffigen.yaml and flows/sdd-flutter_gsm-ffi.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
