name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '11'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Setup signing
        env:
          GATEWAY_ANDROID_KEYSTORE_BASE64: ${{ secrets.GATEWAY_ANDROID_KEYSTORE_BASE64 }}
          GATEWAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GATEWAY_ANDROID_KEYSTORE_PASSWORD }}
          GATEWAY_ANDROID_KEY_ALIAS: ${{ secrets.GATEWAY_ANDROID_KEY_ALIAS }}
          GATEWAY_ANDROID_KEY_PASSWORD: ${{ secrets.GATEWAY_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$GATEWAY_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Setting up release signing..."
            echo "$GATEWAY_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            cat > android/key.properties << EOF
          storePassword=$GATEWAY_ANDROID_KEYSTORE_PASSWORD
          keyPassword=$GATEWAY_ANDROID_KEY_PASSWORD
          keyAlias=$GATEWAY_ANDROID_KEY_ALIAS
          storeFile=release-key.jks
          EOF
            echo "Signing configured successfully"
          else
            echo "Warning: Signing secrets not configured, building unsigned APK"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/GOSTsimbox-gateway-${VERSION}-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
