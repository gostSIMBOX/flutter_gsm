name: flutter_gsm
description: "Cross-platform GSM/UMTS modem hardware abstraction — ttyUSB AT-command modems (Linux/Windows/macOS) and native telephony (Android)"
version: 0.1.0
homepage: "https://github.com/telon/flutter_gsm"

environment:
  sdk: ^3.10.8
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

  # Android telephony backing (AndroidFlutterGsm) — see
  # flows/sdd-flutter_gsm/02-specifications.md §2.2
  flutter_dialer:
    path: ../flutter_dialer
  flutter_tele:
    path: ../flutter_tele
  flutter_smsussd:
    path: ../flutter_smsussd

  # Functional
  dartz: ^0.10.1  # Either type for functional error handling
  equatable: ^2.0.5  # Value equality for entities

  # Logging
  logger: ^2.0.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # HTTP
  http: ^1.2.1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Utilities
  intl: ^0.20.2
  get_it: ^7.6.0
  async: ^2.11.0

  # Linux modem driver — dart:ffi bindings to libsimbox
  # (libsCpp/asterisk_chan_simbox), see flows/sdd-flutter_gsm-ffi
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0

# flutter_dialer/flutter_tele/flutter_smsussd declare
# `plugin_platform_interface: ^3.0.0`, but no 3.x version has ever been
# published (pub.dev's latest is 2.1.8 as of 2026-08-21) — a bug in
# those packages' own pubspec.yaml, not this one. Overriding here rather
# than editing those packages (out of this flow's scope per
# specifications' Won't-Have) — flag as an addendum to fix upstream.
#
# flutter_tele also depends on flutter_dialer from pub.dev (hosted,
# `^2.0.0+101`), but flutter_dialer isn't published there — it's a local
# monorepo package. Overriding to the local path so the whole graph
# agrees on one source for it, same reasoning as above.
dependency_overrides:
  plugin_platform_interface: ^2.1.8
  flutter_dialer:
    path: ../flutter_dialer

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: org.telon.flutter_gsm
        pluginClass: FlutterGsmPlugin
        dartPluginClass: AndroidFlutterGsm
        fileName: src/android/android_flutter_gsm.dart
      linux:
        dartPluginClass: LinuxFlutterGsm
        fileName: src/linux/linux_flutter_gsm.dart
      windows:
        dartPluginClass: WindowsFlutterGsm
        fileName: src/windows/windows_flutter_gsm.dart
      macos:
        dartPluginClass: MacosFlutterGsm
        fileName: src/macos/macos_flutter_gsm.dart

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
